[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Environment variables to configure in Netlify Dashboard:
# ─────────────────────────────────────────────────────────
# Required (Supabase 2025-2026 API Key Format):
#   PUBLIC_SUPABASE_URL              - Your Supabase project URL
#   PUBLIC_SUPABASE_PUBLISHABLE_KEY  - sb_publishable_... (client-safe with RLS)
#   SUPABASE_SECRET_KEY              - sb_secret_... (server-only, bypasses RLS)
#   PUBLIC_SITE_URL                  - Your Netlify domain (e.g., https://mysite.netlify.app)
#   PUBLIC_COMPANY_NAME
#   PUBLIC_DEFAULT_PHONE
#
# Optional (configure as needed):
#   TRACKDRIVE_API_KEY               - TrackDrive call tracking
#   SERVICE_DIRECT_API_KEY
#   SMARTY_AUTH_ID
#   SMARTY_AUTH_TOKEN
#   RENTCAST_API_KEY
#   SHOVELS_API_KEY
#   CENSUS_API_KEY
#   RESEND_API_KEY
#   GEMINI_API_KEY
#   TRUSTEDFORM_ACCOUNT_ID
#
# Security Note: Rate limiting for /api/* endpoints
# ───────────────────────────────────────────────────
# REQUIRED: Enable rate limiting in production to prevent abuse.
# Netlify Edge rate limiting configuration:
# 1. Navigate to Site Settings > Security > Rate limiting
# 2. Enable "Rate limiting" feature
# 3. Add rule: Path=/api/leads, Rate=10 requests/minute per IP
# 4. Add rule: Path=/api/calls, Rate=20 requests/minute per IP
# 5. Response: 429 Too Many Requests
# Alternative: Use Cloudflare rate limiting rules for more granular control
# Without rate limiting, /api/leads and /api/calls endpoints are vulnerable to DoS attacks

[functions]
  directory = ".netlify/functions"
  node_bundler = "esbuild"

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Content Security Policy for defense-in-depth against XSS
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://trustedform.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'"
    # Prevent browsers from MIME type sniffing
    X-DNS-Prefetch-Control = "off"
    # Strict Transport Security (enable HTTPS)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# CORS configuration for API endpoints (restrict to legitimate domains only)
[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://yourroofingdomain.com"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Max-Age = "86400"

# Handle CORS preflight OPTIONS requests
[[redirects]]
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false
  conditions = {Method = ["OPTIONS"]}

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
